<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Your results · ItGo.ai</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
/* Owner dashboard: hero number, where the money came from, weekly chart, activity, upcoming jobs, heads-ups */
:root{--bar:#c26a0e;--good:#1d7a4a;--good-bg:#e3f3ea;--pend:#8a4f00;--pend-bg:#fdf0db}
@media (prefers-color-scheme:dark){:root{--bar:#cf7a18;--good:#6fd39c;--good-bg:#16342a;--pend:#f5c169;--pend-bg:#3a2c12}}
main.wrap{max-width:980px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font:800 30px/1.1 var(--display);margin:0}
.period{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.period button{font:inherit;font-size:15px;font-weight:700;border:0;background:none;color:var(--muted);padding:8px 12px;border-radius:9px;cursor:pointer}
.period button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px}
.hero{margin-bottom:16px}
.hero .label{color:var(--muted);margin:0}
.hero .big{font:700 clamp(48px,9vw,68px)/1.05 var(--body);margin:4px 0}
.hero .sub{margin:0;color:var(--muted)}
h2.sec{font:800 20px/1.2 var(--display);margin:28px 0 10px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.tile .t{color:var(--muted);font-size:15px;margin:0}
.tile .v{font-weight:700;font-size:28px;line-height:1.15;margin:6px 0 4px}
.tile .d{color:var(--muted);font-size:14px;margin:0}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;overflow:visible}
.chartwrap text{font-family:var(--body);fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:14px;white-space:nowrap;transform:translate(-50%,-100%);display:none}
details.table{margin-top:10px;font-size:15px}
details.table summary{cursor:pointer;color:var(--muted)}
details.table table{border-collapse:collapse;margin-top:8px}
details.table td,details.table th{padding:4px 14px 4px 0;text-align:left;font-variant-numeric:tabular-nums}
.list .row{display:grid;grid-template-columns:150px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.list .row:first-child{border-top:0}
.list .when{font-weight:700;font-variant-numeric:tabular-nums}
.list .who{min-width:0;overflow-wrap:anywhere}
.list .who small{display:block;color:var(--muted)}
.list .price{font-variant-numeric:tabular-nums;font-weight:700}
.pill{font-size:13px;font-weight:700;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill.booked{background:var(--good-bg);color:var(--good)}
.pill.pending{background:var(--pend-bg);color:var(--pend)}
.alert{padding:10px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0}
.alert b{display:block}
.alert small{color:var(--muted)}
.empty{color:var(--muted);margin:0}
.banner{background:var(--pend-bg);color:var(--pend);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-weight:700}
.msg{padding:40px 0}
@media (max-width:760px){.tiles{grid-template-columns:1fr 1fr}.list .row{grid-template-columns:1fr auto}.list .who{grid-column:1/-1;grid-row:2}}
</style>
</head>
<body>
<header><div class="wrap"><a class="logo" href="index.html">ItGo<span>.ai</span></a><nav><span style="color:#c9d3dc">Results</span></nav></div></header>
<main class="wrap">
  <div id="banner"></div>
  <div class="top">
    <h1 id="title">Your results</h1>
    <div class="period" role="group" aria-label="Time period">
      <button type="button" data-days="7" aria-pressed="false">7 days</button>
      <button type="button" data-days="30" aria-pressed="true">30 days</button>
      <button type="button" data-days="90" aria-pressed="false">90 days</button>
      <button type="button" data-days="0" aria-pressed="false">All time</button>
    </div>
  </div>
  <div id="out"><p class="msg muted">Loading your numbers…</p></div>
</main>
<footer><div class="wrap"><span>© 2026 ItGo.ai</span><span>Questions? <a href="mailto:itgo.ai@outlook.com">itgo.ai@outlook.com</a></span></div></footer>

<script>
(function(){
  const API = "https://htlssigvpaacxenogkog.supabase.co/functions/v1/sms-webhook?dashboard=1";
  const q = new URLSearchParams(location.search);
  const key = q.get("k") || "";
  const sample = q.has("sample");
  let days = 30, data = null;
  const $ = id => document.getElementById(id);
  const esc = t => String(t ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const money = n => "$" + Math.round(Number(n) || 0).toLocaleString("en-US");
  const short = n => n >= 1000 ? "$" + (Math.round(n / 100) / 10).toString().replace(/\.0$/, "") + "K" : "$" + Math.round(n);
  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
  const periodText = d => d === 0 ? "all time" : "the last " + d + " days";

  // Example numbers for showing detailers what they'd get. Clearly labeled on the page.
  function sampleData(d) {
    const f = d === 7 ? 0.25 : d === 30 ? 1 : d === 90 ? 2.9 : 4.2;
    const r = n => Math.round(n * f);
    const day = (n, h) => { const t = new Date(); t.setDate(t.getDate() + n); t.setHours(h, 0, 0, 0); return t.toISOString(); };
    return {
      business: "Mike's Mobile Detailing", days: d,
      booked_money: r(4385), booked_jobs: r(26), customers_texted: r(41), after_hours: r(14), reply_seconds: 9,
      missed_calls: r(11), missed_call_jobs: r(6), missed_call_money: r(1090),
      rebook_sent: r(18), rebook_jobs: r(7), rebook_money: r(1240), addon_money: r(520),
      reviews_requested: r(22), reminders_sent: r(24), lost_leads: r(4),
      weekly: [["Sep 7", 620], ["Sep 14", 840], ["Sep 21", 710], ["Sep 28", 1050], ["Oct 5", 930], ["Oct 12", 1180], ["Oct 19", 1240], ["Oct 26", 1015]]
        .map(([week, m]) => ({ week, money: m })),
      upcoming: [
        { starts_at: day(1, 9), service_name: "Full Detail + Pet Hair Removal", price: 290, status: "booked", name: "Dana R.", phone: "" },
        { starts_at: day(1, 14), service_name: "Wash & Wax", price: 90, status: "booked", name: "Chris P.", phone: "" },
        { starts_at: day(2, 10), service_name: "Interior Only", price: 150, status: "pending", name: "Alicia M.", phone: "" },
        { starts_at: day(4, 8), service_name: "Full Detail", price: 250, status: "booked", name: "Sam T.", phone: "" },
      ],
      alerts: [
        { kind: "price_request", summary: "Asked if we could do a Full Detail for $200. Has a 2021 Tacoma.", created_at: day(0, 8), name: "Jordan K." },
        { kind: "lost_lead", summary: "Wanted Saturday only and we were booked. Said maybe next month.", created_at: day(-2, 17), name: "Taylor B." },
      ],
    };
  }

  async function load() {
    $("out").innerHTML = '<p class="msg muted">Loading your numbers…</p>';
    if (sample) { data = sampleData(days); render(); return; }
    if (!key) {
      $("out").innerHTML = '<div class="msg"><p>Open this page from the private link in your Monday ItGo text.</p><p><a href="dashboard.html?sample=1">See an example dashboard</a></p></div>';
      return;
    }
    try {
      const res = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ key, days }) });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || "Couldn't load your numbers right now.");
      data = body; render();
    } catch (e) { $("out").innerHTML = '<p class="msg">' + esc(e.message) + "</p>"; }
  }

  function tile(title, value, detail) {
    return '<div class="tile"><p class="t">' + esc(title) + '</p><p class="v">' + esc(value) + '</p><p class="d">' + esc(detail) + "</p></div>";
  }

  function render() {
    const d = data;
    $("title").textContent = d.business;
    document.title = d.business + " results · ItGo.ai";
    $("banner").innerHTML = sample ? '<div class="banner">Example dashboard with made-up numbers, to show what a busy detailer sees.</div>' : "";
    const avg = d.booked_jobs ? d.booked_money / d.booked_jobs : 0;
    const rate = d.customers_texted ? Math.round(100 * Math.min(1, d.booked_jobs / d.customers_texted)) : 0;
    const reply = d.reply_seconds == null ? "–" : d.reply_seconds < 60 ? d.reply_seconds + " sec" : Math.round(d.reply_seconds / 60) + " min";
    const upTotal = d.upcoming.reduce((t, j) => t + Number(j.price), 0);

    $("out").innerHTML =
      '<section class="card hero"><p class="label">Booked by ItGo in ' + periodText(d.days) + '</p>' +
      '<p class="big">' + money(d.booked_money) + '</p>' +
      '<p class="sub">' + plural(d.booked_jobs, "job", "jobs") + (d.booked_jobs ? " · " + money(avg) + " average" : "") + "</p></section>" +

      '<h2 class="sec">Money you\'d likely have missed</h2><div class="tiles">' +
      tile("Missed calls saved", money(d.missed_call_money), plural(d.missed_call_jobs, "job", "jobs") + " from " + plural(d.missed_calls, "missed call", "missed calls")) +
      tile("Past customers back", money(d.rebook_money), d.rebook_jobs + " of " + plural(d.rebook_sent, "customer", "customers") + " invited") +
      tile("Add-ons sold", money(d.addon_money), "Pet hair, odor and other extras") +
      tile("Answered after hours", String(d.after_hours), plural(d.after_hours, "customer", "customers") + " texted while you were closed") +
      "</div>" +

      '<h2 class="sec">Booked each week</h2><div class="card"><div class="chartwrap"><div id="chart"></div><div class="tip" id="tip" role="status"></div></div>' +
      '<details class="table"><summary>Show as a table</summary><table><thead><tr><th>Week of</th><th>Booked</th></tr></thead><tbody>' +
      d.weekly.map(w => "<tr><td>" + esc(w.week) + "</td><td>" + money(w.money) + "</td></tr>").join("") + "</tbody></table></details></div>" +

      '<h2 class="sec">Activity</h2><div class="tiles">' +
      tile("Customers who texted", String(d.customers_texted), rate + "% booked a job") +
      tile("Typical reply time", reply, "From their text to our answer") +
      tile("Reviews requested", String(d.reviews_requested), plural(d.reminders_sent, "reminder", "reminders") + " also sent") +
      tile("Didn't book", String(d.lost_leads), d.lost_leads ? "We texted you each one. Worth a call." : "Nobody walked away") +
      "</div>" +

      '<h2 class="sec">Next 14 days</h2><div class="card list">' +
      (d.upcoming.length ? d.upcoming.map(j => {
        const when = new Date(j.starts_at).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
        return '<div class="row"><span class="when">' + esc(when) + '</span><span class="who">' + esc(j.name || j.phone || "Customer") +
          "<small>" + esc(j.service_name) + '</small></span><span class="price">' + money(j.price) + "</span>" +
          '<span class="pill ' + (j.status === "booked" ? 'booked">✓ Confirmed' : 'pending">⏳ Needs your YES') + "</span></div>";
      }).join("") + '<div class="row"><span class="when">Total</span><span class="who"></span><span class="price">' + money(upTotal) + "</span><span></span></div>"
        : '<p class="empty">Nothing on the calendar for the next 14 days yet.</p>') +
      "</div>" +

      '<h2 class="sec">Heads-ups we sent you</h2><div class="card">' +
      (d.alerts.length ? d.alerts.map(a => {
        const label = { price_request: "Wants a better price", lost_lead: "Didn't book", special_request: "Special request", question: "Has a question", upset: "Unhappy customer" }[a.kind] || "Heads up";
        const when = new Date(a.created_at).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
        return '<div class="alert"><b>' + esc(label) + " · " + esc(a.name || a.phone || "Customer") + "</b>" + esc(a.summary) + "<br><small>" + esc(when) + "</small></div>";
      }).join("") : '<p class="empty">No heads-ups in ' + periodText(d.days) + ".</p>") +
      "</div>";
    drawChart();
  }

  // One series, so no legend: the heading says what's plotted. Hover or tap a week for its total.
  function drawChart() {
    const box = $("chart"); if (!box || !data) return;
    const weeks = data.weekly || [];
    const W = Math.max(280, box.clientWidth), H = 220, padL = 46, padR = 8, padT = 22, padB = 28;
    const max = Math.max(0, ...weeks.map(w => Number(w.money)));
    const raw = Math.max(max, 400) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    const top = step * Math.ceil(Math.max(max, 1) / step);
    const y = v => padT + (H - padT - padB) * (1 - v / top);
    const band = (W - padL - padR) / weeks.length, bw = Math.min(24, band * 0.6);
    let svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Money booked each week for the last 8 weeks">';
    for (let v = 0; v <= top + 0.001; v += step) {
      svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1"/>';
      svg += '<text x="' + (padL - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="12" style="font-variant-numeric:tabular-nums">' + short(v) + "</text>";
    }
    const peak = weeks.reduce((b, w, i) => Number(w.money) > Number(weeks[b].money) ? i : b, 0);
    weeks.forEach((w, i) => {
      const cx = padL + band * (i + 0.5), v = Number(w.money), y0 = y(0), y1 = y(v), h = y0 - y1, r = Math.min(4, h);
      if (h > 0) svg += '<path d="M' + (cx - bw / 2) + " " + y0 + "V" + (y1 + r) + "Q" + (cx - bw / 2) + " " + y1 + " " + (cx - bw / 2 + r) + " " + y1 +
        "H" + (cx + bw / 2 - r) + "Q" + (cx + bw / 2) + " " + y1 + " " + (cx + bw / 2) + " " + (y1 + r) + "V" + y0 + 'Z" fill="var(--bar)"/>';
      // Label only this week and the best week; the tooltip and table carry the rest
      if (v > 0 && (i === weeks.length - 1 || i === peak)) {
        svg += '<text x="' + cx + '" y="' + (y1 - 6) + '" text-anchor="middle" font-size="12" style="fill:var(--ink);font-weight:700">' + short(v) + "</text>";
      }
      if (band >= 52 || i % 2 === weeks.length % 2 || i === weeks.length - 1) {
        svg += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" font-size="12">' + esc(w.week) + "</text>";
      }
      svg += '<rect class="hit" data-i="' + i + '" x="' + (padL + band * i) + '" y="' + padT + '" width="' + band + '" height="' + (H - padT - padB) +
        '" fill="transparent" tabindex="0" aria-label="Week of ' + esc(w.week) + ": " + money(v) + '"/>';
    });
    box.innerHTML = svg + "</svg>";
    const tip = $("tip");
    const show = el => {
      const w = weeks[+el.dataset.i];
      tip.textContent = "Week of " + w.week + ": " + money(w.money);
      tip.style.left = (padL + band * (+el.dataset.i + 0.5)) + "px";
      tip.style.top = (y(Number(w.money)) - 8) + "px";
      tip.style.display = "block";
    };
    box.querySelectorAll(".hit").forEach(el => {
      el.addEventListener("mouseenter", () => show(el));
      el.addEventListener("focus", () => show(el));
      el.addEventListener("click", () => show(el));
      el.addEventListener("mouseleave", () => tip.style.display = "none");
      el.addEventListener("blur", () => tip.style.display = "none");
    });
  }

  document.querySelectorAll(".period button").forEach(b => b.onclick = () => {
    document.querySelectorAll(".period button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    days = Number(b.dataset.days); load();
  });
  let t; addEventListener("resize", () => { clearTimeout(t); t = setTimeout(drawChart, 150); });
  load();
})();
</script>
</body>
</html>
