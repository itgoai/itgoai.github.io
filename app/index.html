<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14212e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ItGo">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>ItGo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@112,800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="../style.css">
<style>
/* Owner app: Today, Messages, Jobs, Settings. Phone first, works on a computer too. */
:root{--bar:#c26a0e;--good:#1d7a4a;--good-bg:#e3f3ea;--pend:#8a4f00;--pend-bg:#fdf0db;--bad:#a3271f;--bad-bg:#fbe4e1;--bubble:#e9edf1;--outb:#1f3a52;--tabh:62px}
@media (prefers-color-scheme:dark){:root{--bar:#cf7a18;--good:#6fd39c;--good-bg:#16342a;--pend:#f5c169;--pend-bg:#3a2c12;--bad:#ff8f84;--bad-bg:#3d1c19;--bubble:#243140;--outb:#2c5277}}
body{font-size:17px;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom))}
body.out{padding-bottom:0}
.bar{background:var(--deep);color:#eef2f6;padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:5}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;height:54px;max-width:760px}
.bar .biz{font-weight:700;color:#c9d3dc;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main.wrap{max-width:760px;padding-block:20px 28px}
h1.page{font:800 26px/1.15 var(--display);margin:0 0 4px}
.date{color:var(--muted);margin:0 0 6px}
h2.sec{font:800 18px/1.2 var(--display);margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.count{font:700 13px/1.5 var(--body);background:var(--accent);color:#14212e;border-radius:99px;padding:0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack>*+*{margin-top:10px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.top b{font-size:18px;min-width:0;overflow-wrap:anywhere}
.price{font-weight:700;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:15px;margin:2px 0 0}
p.body{margin:6px 0 0}
.note{background:var(--pend-bg);color:var(--pend);border-radius:10px;padding:8px 12px;margin:10px 0 0;font-size:15px;font-weight:700}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;align-items:center}
button{font:inherit;cursor:pointer;color:inherit}
.b{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:var(--card);color:var(--ink);font-weight:700;font-size:16px;border-radius:10px;padding:9px 16px;min-height:44px;text-decoration:none}
.b.go{background:var(--good);border-color:var(--good);color:#fff}
.b.main{background:var(--accent);border-color:var(--accent);color:#14212e}
.b.no{color:var(--bad)}
.b.link{border:0;background:none;color:var(--muted);padding:9px 6px;text-decoration:underline;font-weight:400}
.b:disabled{opacity:.5;cursor:default}
.b.wide{width:100%}
@media (prefers-color-scheme:dark){.b.go{color:#0e151c}}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;border:0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;min-height:60px}
.row:first-child{border-top:0}
button.row:hover{background:var(--bg)}
.row .time{font-weight:700;font-variant-numeric:tabular-nums;width:78px;flex:none}
.row .mid{flex:1;min-width:0}
.row .mid b,.row .mid span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .mid span{color:var(--muted);font-size:15px}
.row .end{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .ago{color:var(--muted);font-size:14px}
.pill{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;white-space:nowrap}
.pill.booked{background:var(--good-bg);color:var(--good)}
.pill.pending{background:var(--pend-bg);color:var(--pend)}
.pill.canceled{background:var(--bad-bg);color:var(--bad)}
.pill.done{background:var(--bubble);color:var(--muted)}
.empty{color:var(--muted);margin:0}
.list .empty{padding:14px 16px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat .t{color:var(--muted);font-size:14px;margin:0}
.stat .v{font-weight:700;font-size:24px;margin:2px 0 0;font-variant-numeric:tabular-nums}
.stat .d{color:var(--muted);font-size:14px;margin:0}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--bubble);display:grid;place-items:center;font-weight:700;flex:none}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.daygroup{font-weight:700;color:var(--muted);font-size:15px;margin:18px 0 6px}
.daygroup:first-child{margin-top:0}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin:8px 0 14px}
.seg button{border:0;background:none;color:var(--muted);font-weight:700;font-size:15px;padding:8px 16px;border-radius:9px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.sample{background:var(--pend-bg);color:var(--pend);border-radius:12px;padding:10px 14px;margin-bottom:16px;font-weight:700;font-size:15px}
/* Bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs[hidden]{display:none}
.tabs .tabin{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;font-size:12px;font-weight:700;position:relative;min-height:var(--tabh)}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"] svg{stroke:var(--accent)}
.tabs svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabs .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--accent);color:#14212e;border-radius:99px;font-size:11px;line-height:18px;padding:0 6px;min-width:18px}
/* Chat */
.chathead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.chathead .mid{flex:1;min-width:0}
.chathead h1{font:800 22px/1.2 var(--display);margin:0;overflow-wrap:anywhere}
.back{border:0;background:none;color:var(--muted);font-weight:700;padding:8px 8px 8px 0;min-height:44px}
.handoff{display:flex;justify-content:space-between;align-items:center;gap:6px 12px;flex-wrap:wrap;border-radius:12px;padding:8px 8px 8px 14px;margin-bottom:12px;font-size:15px;font-weight:700}
.handoff.ai{background:var(--good-bg);color:var(--good)}
.handoff.me{background:var(--pend-bg);color:var(--pend)}
.handoff .b{min-height:38px;padding:6px 12px;font-size:15px}
.nextjob{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.bubbles{display:flex;flex-direction:column;gap:4px}
.bub{max-width:82%;padding:9px 13px;border-radius:18px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4}
.bub.cust{align-self:flex-start;background:var(--bubble);border-bottom-left-radius:5px}
.bub.ours{align-self:flex-end;background:var(--outb);color:#eef2f6;border-bottom-right-radius:5px}
.by{font-size:12px;color:var(--muted);align-self:flex-end;margin:0 4px 8px}
.by.cust{align-self:flex-start}
.daysep{text-align:center;color:var(--muted);font-size:13px;margin:12px 0 6px}
.compose{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));background:var(--bg);padding:10px 0 4px;display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.compose textarea{flex:1;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--card);color:var(--ink);resize:none;min-height:46px;max-height:150px}
/* Forms */
.f{display:block;margin-top:16px;font-weight:700;font-size:15px}
.f:first-child{margin-top:0}
.f small{display:block;font-weight:400;color:var(--muted)}
.in{display:block;width:100%;margin-top:6px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);color:var(--ink);min-height:46px}
textarea.in{min-height:90px;resize:vertical}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:16px;font-size:16px}
.check input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--good);flex:none}
.check small{display:block;color:var(--muted);font-size:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hrow{display:grid;grid-template-columns:auto 1fr 1fr;gap:8px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow label{display:flex;gap:8px;align-items:center;font-weight:700;min-width:82px}
.hrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--good)}
.hrow .in{margin:0}
.hrow .closed{grid-column:2/-1;color:var(--muted)}
.savebar{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom));background:var(--bg);padding:12px 0 6px;margin-top:12px}
/* Bottom sheet */
dialog.sheet{border:0;border-radius:20px 20px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:640px;margin:auto auto 0;background:var(--card);color:var(--ink);max-height:90vh;overflow:auto}
dialog.sheet::backdrop{background:rgba(8,12,16,.55)}
@media (min-width:700px){dialog.sheet{border-radius:20px;margin:auto}}
.sheet h2{font:800 22px/1.2 var(--display);margin:0 0 4px}
.facts{margin:16px 0 0;display:grid;gap:10px}
.facts div{display:grid;grid-template-columns:130px 1fr;gap:10px}
.facts dt{color:var(--muted)}
.facts dd{margin:0;overflow-wrap:anywhere}
#toast{position:fixed;left:50%;bottom:calc(var(--tabh) + 18px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;width:max-content;max-width:90vw;z-index:20;text-align:center}
#toast.show{opacity:1}
.login{max-width:440px;margin:24px auto 0}
.login .card{padding:24px}
.login form{margin-top:18px}
.msg{padding:40px 0;color:var(--muted)}
.bar .right{display:flex;align-items:center;gap:4px;min-width:0}
.gear{border:0;background:none;color:#c9d3dc;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;flex:none}
.gear svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.gear[aria-current="page"]{color:var(--accent)}
[hidden]{display:none!important}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.toprow h1{margin:0}
.search{margin:12px 0}
.win{display:block;width:100%;text-align:left;background:var(--deep);color:#eef2f6;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:10px}
.win b{display:block;font-size:24px;color:var(--accent);font-variant-numeric:tabular-nums}
.win span{color:#c9d3dc;font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile .t{color:var(--muted);font-size:14px;margin:0}
.tile .v{font-weight:700;font-size:24px;margin:2px 0;font-variant-numeric:tabular-nums}
.tile .d{color:var(--muted);font-size:14px;margin:0}
@media (min-width:700px){.tiles{grid-template-columns:repeat(4,1fr)}}
.bigcard .label{color:var(--muted);margin:0}
.bigcard .big{font:700 clamp(40px,10vw,56px)/1.05 var(--body);margin:4px 0;font-variant-numeric:tabular-nums}
.chartwrap{position:relative}
.chartwrap svg{display:block;width:100%;overflow:visible}
.chartwrap text{font-family:var(--body);fill:var(--muted)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:14px;white-space:nowrap;transform:translate(-50%,-100%);display:none}
.addons{display:grid;gap:6px;margin-top:8px}
.addons label{display:flex;gap:10px;align-items:center;font-weight:400;font-size:16px}
.addons input{width:20px;height:20px;accent-color:var(--good);flex:none}
.hint{color:var(--muted);font-size:14px;margin:6px 0 0}
</style>
</head>

  <button type="button" data-tab="messages"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Messages<span class="badge" hidden></span></button>

  <button type="button" data-tab="customers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5c1.8.8 3 2.7 3 5.5"/></svg>Customers</button>

</div></nav>
<dialog class="sheet" id="sheet"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

  const plural = (n, one, many) => n + " " + (n === 1 ? one : many);

    const services = [
      ["Maintenance Wash", 150, 120, "Freshwater wash top to bottom, hull sides, windows and stainless wiped down, vinyl wiped.", false],

  // ---------- Loading real data (row security means owners only ever see their own business) ----------
  async function load() {
    const { data: bizId, error } = await sb.rpc("claim_my_business");
    if (error) throw error;
    if (!bizId) return false;
    const since = new Date(Date.now() - 60 * 864e5).toISOString();
    const [biz, services, hours, jobs, messages, customers, alerts, totals] = await Promise.all([
      sb.from("businesses").select("*").eq("id", bizId).single(),
      sb.from("services").select("*").eq("business_id", bizId).order("is_addon").order("price"),
      sb.from("working_hours").select("*").eq("business_id", bizId),
      sb.from("jobs").select("*").eq("business_id", bizId).gte("starts_at", since).order("starts_at").limit(1000),
      sb.from("messages").select("id, customer_id, direction, body, sent_by, created_at").eq("business_id", bizId)
        .order("created_at", { ascending: false }).limit(1000),
      sb.from("customers").select("*").eq("business_id", bizId).limit(5000),
      sb.from("alerts").select("*").eq("business_id", bizId).eq("handled", false).order("created_at", { ascending: false }).limit(50),
      sb.rpc("my_customer_totals"),
    ]);
    for (const r of [biz, services, hours, jobs, messages, customers, alerts, totals]) if (r.error) throw r.error;
    const byId = {};
    for (const c of customers.data) byId[c.id] = c;
    const tot = {};
    for (const t of totals.data || []) tot[t.customer_id] = t;
    S = { biz: biz.data, services: services.data, hours: hours.data, jobs: jobs.data, messages: messages.data, customers: byId, alerts: alerts.data, totals: tot };
    return true;
  }

  // ---------- Actions ----------
  async function act(name, p = {}, btn) {
    if (busy) return;
    busy = true; if (btn) btn.disabled = true;
    try {
      const msg = await (sample ? sampleAct : realAct)(name, p);
      if (!sample) await load();
      results = null;
      closeSheet(); render();
      if (msg) toast(msg);
    } catch (e) {
      toast(e.message || "Something went wrong. Try again.");
      if (btn) btn.disabled = false;
    } finally { busy = false; }
  }

  function sampleAct(name, p) {
    const j = p.job_id && S.jobs.find(x => x.id === p.job_id);
    const c = j ? cust(j.customer_id) : p.customer_id ? cust(p.customer_id) : null;
    const say = (body, by = "owner") => S.messages.push({ id: "m" + Math.random(), customer_id: c.id, direction: "out", sent_by: by, body, created_at: new Date().toISOString() });
    if (name === "approve") {
      j.price = j.customer_offer ?? j.price; j.status = "booked";
      say("Good news " + first(c) + ", you're all set! " + j.service_name + " on " + whenAt(j.starts_at) + " for " + money(j.price) + ". See you then! Just text here if anything changes.");
      return "Approved. " + first(c) + " got a confirmation text.";
    }
    if (name === "decline") {
      j.status = "canceled";
      say("Hey " + first(c) + ", we can't make that exact one work, but we'll reach out shortly to sort out something that does.");
      return "Declined. We told " + first(c) + " you'll reach out.";
    }
    if (name === "cancel") {
      j.status = "canceled";
      if (p.notify) say("Hi " + first(c) + ", we've had to cancel your " + j.service_name + " on " + whenAt(j.starts_at) + ". Sorry about that! Text us here and we'll find a new time.");
      return p.notify ? "Canceled. " + first(c) + " got a text." : "Canceled. No text was sent.";
    }
    if (name === "done") { j.status = "done"; return "Marked done."; }
    if (name === "handled") { S.alerts = S.alerts.filter(a => a.id !== p.id); return "Marked handled."; }
    if (name === "send") { say(p.body); c.ai_paused = true; return ""; }
    if (name === "pause") { c.ai_paused = p.on; return p.on ? "You're handling this chat now." : "The assistant is answering again."; }
    if (name === "saveService") {
      const old = p.id && S.services.find(s => s.id === p.id);
      if (old) Object.assign(old, p); else S.services.push({ ...p, id: "s" + Math.random() });
      return "Service saved.";
    }
    if (name === "saveSettings") {
      Object.assign(S.biz, p.biz);
      S.hours = p.hours;
      return "Saved.";
    }
    if (name === "saveCustomer") { Object.assign(cust(p.id), p.fields); return "Customer saved."; }
    if (name === "saveJob") {
      let cid = p.customer_id;
      if (!cid) {
        const phone = "+1" + String(p.phone).replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
        if (phone.length !== 12) throw new Error("Add the customer's 10-digit phone number.");
        cid = Object.values(S.customers).find(c => c.phone === phone)?.id || "c" + Math.random();
        S.customers[cid] ||= { id: cid, name: p.name || "", phone, vehicle: "", address: "", notes: "" };
      }
      const start = new Date(p.date + "T" + p.time.padStart(5, "0"));
      const row = { service_name: p.service_name, price: p.price, notes: p.notes || null, starts_at: start.toISOString(),
        ends_at: new Date(start.getTime() + p.duration_minutes * 6e4).toISOString() };
      const old = p.job_id && S.jobs.find(j => j.id === p.job_id);
      if (old) Object.assign(old, row);
      else S.jobs.push({ id: "j" + Math.random(), customer_id: cid, status: "booked", source: "app", customer_offer: null, created_at: new Date().toISOString(), ...row });
      return (old ? "Job updated." : "Job added.") + (p.notify ? " (Sample: no text sent.)" : "");
    }
  }

  async function realAct(name, p) {
    // These text the customer, so they go through ItGo's server
    if (["approve", "decline", "cancel", "send", "saveJob"].includes(name)) {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) throw new Error("Please sign in again.");
      const res = await fetch(FN, {
        method: "POST",
        headers: { "content-type": "application/json", authorization: "Bearer " + session.access_token },
        body: JSON.stringify({ action: name === "saveJob" ? "save_job" : name, ...p }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(body.error || "Couldn't do that right now. Try again.");
      return body.message || "";
    }
    const check = r => { if (r.error) throw new Error(r.error.message); };
    if (name === "done") { check(await sb.from("jobs").update({ status: "done" }).eq("id", p.job_id)); return "Marked done."; }
    if (name === "handled") { check(await sb.from("alerts").update({ handled: true }).eq("id", p.id)); return "Marked handled."; }
    if (name === "pause") {
      check(await sb.from("customers").update({ ai_paused: p.on }).eq("id", p.customer_id));
      return p.on ? "You're handling this chat now." : "The assistant is answering again.";
    }
    if (name === "saveService") {
      const { id, ...row } = p;
      check(id ? await sb.from("services").update(row).eq("id", id)
               : await sb.from("services").insert({ ...row, business_id: S.biz.id }));
      return "Service saved.";
    }
    if (name === "saveCustomer") { check(await sb.from("customers").update(p.fields).eq("id", p.id)); return "Customer saved."; }
    if (name === "saveSettings") {
      check(await sb.from("businesses").update(p.biz).eq("id", S.biz.id));
      check(await sb.from("working_hours").delete().eq("business_id", S.biz.id));
      if (p.hours.length) check(await sb.from("working_hours").insert(p.hours.map(h => ({ ...h, business_id: S.biz.id }))));
      return "Saved.";
    }
  }

  // ---------- Screens ----------
  function convos() {
    const by = {};
    for (const m of S.messages) if (m.customer_id) (by[m.customer_id] ||= []).push(m);
    return Object.entries(by).map(([cid, ms]) => {
      const last = ms.reduce((a, b) => a.created_at > b.created_at ? a : b);
      const c = cust(cid);
      return { c, last, needsReply: !!c.ai_paused && last.direction === "in" };
    }).sort((a, b) => a.last.created_at < b.last.created_at ? 1 : -1);
  }

  function pill(j) {
    const now = Date.now(), start = new Date(j.starts_at), end = new Date(j.ends_at);
    if (j.status === "pending") return '<span class="pill pending">Needs your OK</span>';
    if (j.status === "canceled") return '<span class="pill canceled">Canceled</span>';
    if (j.status === "done") return '<span class="pill done">Done</span>';
    if (start <= now && end > now) return '<span class="pill booked">Happening now</span>';
    if (end <= now) return '<span class="pill pending">Mark done?</span>';
    return '<span class="pill booked">Confirmed</span>';
  }

  function viewToday() {
    const now = Date.now(), today = dayKey(now);
    const hour = Number(f(now, { hour: "numeric", hourCycle: "h23" }));
    const hello = hour < 12 ? "Good morning" : hour < 17 ? "Good afternoon" : "Good evening";
    const pending = S.jobs.filter(j => j.status === "pending").sort(byStart);
    const todays = S.jobs.filter(j => dayKey(j.starts_at) === today && j.status !== "canceled").sort(byStart);
    const unfinished = S.jobs.filter(j => j.status === "booked" && dayKey(j.starts_at) < today).sort(byStart);
    const coming = S.jobs.filter(j => j.status === "booked" && dayKey(j.starts_at) > today).sort(byStart);
    const week = coming.filter(j => new Date(j.starts_at) < now + 7 * 864e5).concat(todays.filter(j => j.status === "booked"));
    const done30 = S.jobs.filter(j => j.status === "done" && new Date(j.starts_at) > now - 30 * 864e5);
    const needs = pending.length + S.alerts.length;
    const sum = js => js.reduce((t, j) => t + Number(j.price), 0);

    const won = S.jobs.filter(j => j.source === "sms" && ["booked", "done"].includes(j.status) && new Date(j.created_at) > now - 30 * 864e5);
    return '<h1 class="page">' + hello + "</h1>" +
      '<p class="date">' + esc(f(now, { weekday: "long", month: "long", day: "numeric" })) + "</p>" +
      (won.length ? '<button type="button" class="win" data-tab="results"><b>' + money(sum(won)) + "</b><span>booked by your ItGo assistant in the last 30 days · " + plural(won.length, "job", "jobs") + " · See results ›</span></button>" : "") +
      '<div class="stats">' +
      '<div class="card stat"><p class="t">Booked, next 7 days</p><p class="v">' + money(sum(week)) + '</p><p class="d">' + plural(week.length, "job", "jobs") + "</p></div>" +
      '<div class="card stat"><p class="t">Finished, last 30 days</p><p class="v">' + money(sum(done30)) + '</p><p class="d">' + plural(done30.length, "job", "jobs") + "</p></div></div>" +

      '<h2 class="sec">Needs you' + (needs ? ' <span class="count">' + needs + "</span>" : "") + "</h2>" +
      (needs ? '<div class="stack">' + pending.map(requestCard).join("") + S.alerts.map(alertCard).join("") + "</div>"
             : '<p class="empty">You\'re all caught up. The assistant is handling everything.</p>') +

      (unfinished.length ? '<h2 class="sec">Did these get done?</h2><div class="list">' + unfinished.map(j => jobRow(j, dayLabel(j.starts_at).replace(/^\w+, /, ""))).join("") + "</div>" : "") +

      (todays.length ? todays.map(j => jobRow(j)).join("") : '<p class="empty">No jobs today.</p>') + "</div>" +

  }

  function viewChat() {
    const c = cust(chatId);
    const ms = S.messages.filter(m => m.customer_id === chatId).sort((a, b) => a.created_at < b.created_at ? -1 : 1);
    const next = S.jobs.filter(j => j.customer_id === chatId && ["pending", "booked"].includes(j.status) && new Date(j.ends_at) > Date.now()).sort(byStart)[0];
    let lastDay = "", html = "";
    for (const m of ms) {
      const d = dayKey(m.created_at);
      if (d !== lastDay) { html += '<p class="daysep">' + esc(dayLabel(m.created_at)) + "</p>"; lastDay = d; }
      html += '<div class="bub ' + (m.direction === "in" ? "cust" : "ours") + '">' + esc(m.body) + "</div>" +
        '<span class="by ' + (m.direction === "in" ? "cust" : "") + '">' + (m.direction === "in" ? "" : esc(BY[m.sent_by] || "Sent") + " · ") + esc(clock(m.created_at)) + "</span>";

  // Lifetime numbers for one customer. Sample mode adds made-up older visits to the jobs on screen.
  function totalsFor(cid) {
    const base = S.totals[cid] || {};
    if (!S.sampleHistory) return { visits: Number(base.visits) || 0, spent: Number(base.spent) || 0, first_visit: base.first_visit, last_visit: base.last_visit, next_visit: base.next_visit };
    const now = Date.now(), js = S.jobs.filter(j => j.customer_id === cid);
    const past = js.filter(j => ["booked", "done"].includes(j.status) && new Date(j.starts_at) < now).sort(byStart);
    const next = js.filter(j => ["pending", "booked"].includes(j.status) && new Date(j.starts_at) >= now).sort(byStart)[0];
    return {
      visits: (base.visits || 0) + past.length, spent: (base.spent || 0) + past.reduce((t, j) => t + Number(j.price), 0),
      first_visit: base.first_visit || past[0]?.starts_at, last_visit: past.at(-1)?.starts_at || base.first_visit, next_visit: next?.starts_at,
    };
  }

      missed_calls: r(9), missed_call_jobs: r(5), missed_call_money: r(2650), rebook_sent: r(14), rebook_jobs: r(6), rebook_money: r(2310),
      addon_money: r(1180), reviews_requested: r(16), reminders_sent: r(21), lost_leads: r(3),

  // One series, so no legend: the heading says what's plotted. Hover or tap a week for its total.
  function drawChart() {
    const box = $("chart"); if (!box || !results) return;
    const weeks = results.data.weekly || [];
    if (!weeks.length) { box.innerHTML = '<p class="empty">No bookings yet.</p>'; return; }
    const W = Math.max(280, box.clientWidth), H = 220, padL = 46, padR = 8, padT = 22, padB = 28;
    const max = Math.max(0, ...weeks.map(w => Number(w.money)));
    const raw = Math.max(max, 400) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
    const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    const top = step * Math.ceil(Math.max(max, 1) / step);
    const y = v => padT + (H - padT - padB) * (1 - v / top);
    const band = (W - padL - padR) / weeks.length, bw = Math.min(24, band * 0.6);
    let svg = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Money booked each week">';
    for (let v = 0; v <= top + 0.001; v += step) {
      svg += '<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--line)" stroke-width="1"/>';
      svg += '<text x="' + (padL - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="12" style="font-variant-numeric:tabular-nums">' + short(v) + "</text>";
    }
    const peak = weeks.reduce((b, w, i) => Number(w.money) > Number(weeks[b].money) ? i : b, 0);
    weeks.forEach((w, i) => {
      const cx = padL + band * (i + 0.5), v = Number(w.money), y0 = y(0), y1 = y(v), h = y0 - y1, r = Math.min(4, h);
      if (h > 0) svg += '<path d="M' + (cx - bw / 2) + " " + y0 + "V" + (y1 + r) + "Q" + (cx - bw / 2) + " " + y1 + " " + (cx - bw / 2 + r) + " " + y1 +
        "H" + (cx + bw / 2 - r) + "Q" + (cx + bw / 2) + " " + y1 + " " + (cx + bw / 2) + " " + (y1 + r) + "V" + y0 + 'Z" fill="var(--bar)"/>';
      if (v > 0 && (i === weeks.length - 1 || i === peak))
        svg += '<text x="' + cx + '" y="' + (y1 - 6) + '" text-anchor="middle" font-size="12" style="fill:var(--ink);font-weight:700">' + short(v) + "</text>";
      if (band >= 52 || i % 2 === weeks.length % 2 || i === weeks.length - 1)
        svg += '<text x="' + cx + '" y="' + (H - 8) + '" text-anchor="middle" font-size="12">' + esc(w.week) + "</text>";
      svg += '<rect class="hit" data-i="' + i + '" x="' + (padL + band * i) + '" y="' + padT + '" width="' + band + '" height="' + (H - padT - padB) +
        '" fill="transparent" tabindex="0" aria-label="Week of ' + esc(w.week) + ": " + money(v) + '"/>';
    });
    box.innerHTML = svg + "</svg>";
    const tip = $("tip");
    const show = el => {
      const w = weeks[+el.dataset.i];
      tip.textContent = "Week of " + w.week + ": " + money(w.money);
      tip.style.left = (padL + band * (+el.dataset.i + 0.5)) + "px";
      tip.style.top = (y(Number(w.money)) - 8) + "px";
      tip.style.display = "block";
    };
    box.querySelectorAll(".hit").forEach(el => {
      el.addEventListener("mouseenter", () => show(el));
      el.addEventListener("focus", () => show(el));
      el.addEventListener("click", () => show(el));
      el.addEventListener("mouseleave", () => tip.style.display = "none");
      el.addEventListener("blur", () => tip.style.display = "none");
    });
  }

      '<dl class="facts">' + fact("Customer", esc(who(c)) + (c.name && c.phone ? "<br>" + esc(prettyPhone(c.phone)) : "")) +
      fact("Boat or vehicle", esc([c.vehicle, c.length_ft && !String(c.vehicle || "").includes(String(Number(c.length_ft))) ? Number(c.length_ft) + " ft" : ""].filter(Boolean).join(", "))) + fact("Where", esc(c.address)) + fact("Price", money(j.price)) +
      fact("Status", pill(j)) + fact("Notes", esc(j.notes)) + "</dl>" +
      '<div class="btns">' + btns.join("") + '</div><div class="btns"><button type="button" class="b link" data-close>Close</button></div>');
  }

  function custSheet(id, editing) {
    const c = S.customers[id]; if (!c) return;
    if (editing) {
      return openSheet("<h2>Edit customer</h2>" + '<form id="custform" data-id="' + esc(c.id) + '">' +
        '<label class="f">Name<input class="in" name="name" maxlength="80" autocomplete="off" value="' + esc(c.name) + '"></label>' +
        '<div class="two"><label class="f">Boat or vehicle<input class="in" name="vehicle" maxlength="120" value="' + esc(c.vehicle) + '"></label>' +
        '<label class="f">Length (ft)<input class="in" name="length_ft" type="number" min="0" max="300" step="1" inputmode="numeric" value="' + esc(c.length_ft ?? "") + '"></label></div>' +
        '<label class="f">Where<small>Address, or marina and slip</small><input class="in" name="address" maxlength="200" value="' + esc(c.address) + '"></label>' +
        '<label class="f">Your notes<small>Only you see these. Gate codes, how they pay, what they\'re picky about.</small><textarea class="in" name="notes" rows="3" maxlength="1000">' + esc(c.notes) + "</textarea></label>" +
        '<div class="btns"><button class="b main" type="submit">Save</button><button type="button" class="b link" data-cust="' + c.id + '">Cancel</button></div></form>');
    }
    const t = totalsFor(id), now = Date.now();
    const fact = (k, v) => v ? "<div><dt>" + k + "</dt><dd>" + v + "</dd></div>" : "";
    const day = d => esc(f(d, { month: "short", day: "numeric", year: "numeric" }));
    const js = S.jobs.filter(j => j.customer_id === id).sort((a, b) => byStart(b, a));
    const boat = [c.vehicle, c.length_ft && !String(c.vehicle || "").includes(String(Number(c.length_ft))) ? Number(c.length_ft) + " ft" : ""].filter(Boolean).join(", ");
    openSheet("<h2>" + esc(who(c)) + "</h2>" +
      '<p class="sub">' + esc([c.name ? prettyPhone(c.phone) : "", c.ai_paused ? "You're handling texts" : ""].filter(Boolean).join(" · ")) + "</p>" +
      '<div class="tiles" style="margin-top:14px">' + tile("Spent with you", money(t.spent), "All time") + tile("Visits", String(t.visits), t.last_visit ? "Last on " + f(t.last_visit, { month: "short", day: "numeric" }) : "None yet") + "</div>" +
      '<dl class="facts">' + fact("Boat or vehicle", esc(boat)) + fact("Where", esc(c.address)) +
      fact("Next visit", t.next_visit ? esc(whenText(t.next_visit)) : "") + fact("Customer since", t.first_visit ? day(t.first_visit) : "") +
      fact("Your notes", esc(c.notes)) + "</dl>" +
      '<div class="btns"><button type="button" class="b main" data-newjob="' + c.id + '">+ Book a job</button><button type="button" class="b" data-chat="' + c.id + '">Messages</button>' +
      (c.phone ? '<a class="b" href="tel:' + esc(c.phone) + '">Call</a>' : "") + '<button type="button" class="b" data-custedit="' + c.id + '">Edit</button></div>' +
      (js.length ? '<h2 class="sec">Jobs</h2><div class="list">' + js.map(j => jobRow(j, f(j.starts_at, { month: "short", day: "numeric" }))).join("") + "</div>" : "") +
      (S.sampleHistory && t.visits > js.filter(j => ["booked", "done"].includes(j.status) && new Date(j.starts_at) < now).length ? '<p class="hint">Older visits are counted in the totals above.</p>' : "") +
      '<div class="btns"><button type="button" class="b link" data-close>Close</button></div>');
  }

  // New job, or edit one. Price fills in from the service, add-ons and boat length until the owner types their own.
  function jobForm(jobId, cid) {
    const j = jobId && S.jobs.find(x => x.id === jobId);
    if (j) cid = j.customer_id;
    const c = cid ? S.customers[cid] : null;
    const mains = S.services.filter(s => !s.is_addon && s.active), adds = S.services.filter(s => s.is_addon && s.active);
    const svc = j ? S.services.find(s => s.id === j.service_id) || mains.find(s => j.service_name.startsWith(s.name)) : mains[0];
    const start = j ? new Date(j.starts_at) : (() => { const t = new Date(Date.now() + 864e5); t.setHours(9, 0, 0, 0); return t; })();
    const pad = n => String(n).padStart(2, "0");
    const date = start.getFullYear() + "-" + pad(start.getMonth() + 1) + "-" + pad(start.getDate()), time = pad(start.getHours()) + ":" + pad(start.getMinutes());
    const custs = Object.values(S.customers).sort((a, b) => who(a).localeCompare(who(b)));
    const hours = j ? (new Date(j.ends_at) - start) / 36e5 : Number(svc?.duration_minutes || 120) / 60;
    openSheet("<h2>" + (j ? "Edit job" : "New job") + '</h2><form id="jobform" data-id="' + esc(j?.id || "") + '"' + (j ? ' data-touched="1"' : "") + ">" +
      (j ? '<p class="sub">' + esc(who(c)) + '</p><input type="hidden" name="cust" value="' + esc(cid) + '">'
         : '<label class="f">Customer<select class="in" name="cust"><option value="">+ New customer</option>' +
           custs.map(x => '<option value="' + x.id + '"' + (x.id === cid ? " selected" : "") + ">" + esc(who(x)) + (x.name ? " · " + esc(prettyPhone(x.phone)) : "") + "</option>").join("") + "</select></label>" +
           '<div class="two" id="newcust"' + (c ? " hidden" : "") + '><label class="f">Name<input class="in" name="name" maxlength="80" autocomplete="off"></label>' +
           '<label class="f">Cell<input class="in" name="phone" type="tel" autocomplete="off"></label></div>') +
      '<label class="f">Service<select class="in" name="svc">' + mains.map(s => '<option value="' + s.id + '"' + (s === svc ? " selected" : "") + ">" + esc(s.name) + " · " + esc(priceText(s)) + "</option>").join("") + "</select></label>" +
      (adds.length ? '<p class="f" style="margin-bottom:0">Add-ons</p><div class="addons">' + adds.map(s => '<label><input type="checkbox" name="add" value="' + s.id + '"' +
        (j && j.service_name.includes(s.name) ? " checked" : "") + ">" + esc(s.name) + " · " + esc(priceText(s)) + "</label>").join("") + "</div>" : "") +
      '<div class="two"><label class="f">Length (ft)<small>For per-foot prices</small><input class="in" name="len" type="number" min="0" max="300" step="1" inputmode="numeric" value="' + esc(c?.length_ft ?? "") + '"></label>' +
      '<label class="f">Price ($)<small>Fills in on its own</small><input class="in" name="price" type="number" min="0" step="1" inputmode="decimal" required value="' + esc(j ? Number(j.price) : "") + '"></label></div>' +
      '<div class="two"><label class="f">Day<input class="in" name="date" type="date" required value="' + date + '"></label>' +
      '<label class="f">Start time<input class="in" name="time" type="time" step="900" required value="' + time + '"></label></div>' +
      '<label class="f">Hours it takes<input class="in" name="hours" type="number" min="0.25" step="0.25" inputmode="decimal" required value="' + hours + '"></label>' +
      '<label class="f">Notes<small>Marina, slip, gate code, anything for the day</small><textarea class="in" name="notes" rows="2" maxlength="1000">' + esc(j?.notes || "") + "</textarea></label>" +
      '<label class="check"><input type="checkbox" name="notify" checked><span>Text the customer ' + (j ? "about the change" : "that they're booked") + "<small>Uncheck if you already told them.</small></span></label>" +
      '<div class="btns"><button class="b main" type="submit">' + (j ? "Save changes" : "Add job") + '</button><button type="button" class="b link" data-close>Cancel</button></div></form>');
    if (!j) fillJobForm($("jobform"));
  }

  // Price and hours from the chosen service, add-ons and length
  function fillJobForm(form) {
    const v = new FormData(form), len = Number(v.get("len")) || 0;
    const picked = [S.services.find(s => s.id === v.get("svc")), ...v.getAll("add").map(id => S.services.find(s => s.id === id))].filter(Boolean);
    const hint = form.querySelector('[name="price"]').closest("label").querySelector("small");
    hint.textContent = picked.some(s => Number(s.price_per_foot) > 0) && !len ? "Add the length for per-foot prices" : "Fills in on its own";
    if (form.dataset.touched) return;
    form.price.value = picked.reduce((t, s) => t + priceFor(s, len), 0);
    form.hours.value = Math.max(0.5, picked.reduce((t, s) => t + Number(s.duration_minutes), 0) / 60);
  }

  function saveJobForm(form) {
    const v = new FormData(form);
    const picked = [S.services.find(s => s.id === v.get("svc")), ...v.getAll("add").map(id => S.services.find(s => s.id === id))].filter(Boolean);
    if (!picked.length) return toast("Add a service in Settings first.");
    const cid = String(v.get("cust") || "");
    const len = Number(v.get("len")) || 0;
    const p = {
      ...(form.dataset.id ? { job_id: form.dataset.id } : {}),
      ...(cid ? { customer_id: cid } : { name: String(v.get("name") || "").trim(), phone: String(v.get("phone") || "") }),
      service_id: picked[0].id, service_name: picked.map(s => s.name).join(" + "),
      price: Number(v.get("price")), date: String(v.get("date")), time: String(v.get("time")),
      duration_minutes: Math.round(Number(v.get("hours")) * 60), notes: String(v.get("notes") || "").trim(), notify: v.has("notify"),
      ...(len > 0 ? { length_ft: len } : {}),
    };
    if (!(p.price >= 0) || v.get("price") === "") return toast("Add a price.");
    act("saveJob", p, form.querySelector('button[type="submit"]'));
  }

  function serviceSheet(id) {
    const s = S.services.find(x => x.id === id) || { name: "", price: "", price_per_foot: null, duration_minutes: 120, includes: "", is_addon: false, active: true };
    openSheet("<h2>" + (s.id ? "Edit service" : "New service") + '</h2><form id="svcform" data-id="' + esc(s.id || "") + '">' +
      '<label class="f">Name<input class="in" name="name" required maxlength="80" value="' + esc(s.name) + '"></label>' +
      '<div class="two"><label class="f">Price ($)<input class="in" name="price" type="number" min="0" step="1" inputmode="decimal" required value="' + esc(s.price) + '"></label>' +
      '<label class="f">Hours it takes<input class="in" name="hours" type="number" min="0.5" step="0.5" inputmode="decimal" required value="' + Number(s.duration_minutes) / 60 + '"></label></div>' +
      '<label class="f">Price per foot ($)<small>For boats priced by length. Then the price above is the minimum. Leave blank for a flat price.</small><input class="in" name="ppf" type="number" min="0" step="0.5" inputmode="decimal" value="' + esc(s.price_per_foot ?? "") + '"></label>' +
      '<label class="f">What\'s included<small>The assistant reads this to customers who ask.</small><textarea class="in" name="includes" rows="3" maxlength="600">' + esc(s.includes) + "</textarea></label>" +
      '<label class="check"><input type="checkbox" name="is_addon"' + (s.is_addon ? " checked" : "") + "><span>This is an add-on<small>Added to another service, like teak cleaning.</small></span></label>" +
      '<label class="check"><input type="checkbox" name="active"' + (s.active ? " checked" : "") + "><span>Offer this to customers<small>Uncheck to hide it without deleting it.</small></span></label>" +
      '<div class="btns"><button class="b main" type="submit">Save service</button><button type="button" class="b link" data-close>Cancel</button></div></form>');
  }

  // ---------- Drawing ----------
  function setBadge(name, n) {
    const el = document.querySelector('[data-tab="' + name + '"] .badge');
    if (el) { el.hidden = !n; el.textContent = n; }
  }

  function render() {
    document.body.classList.remove("out");
    $("tabs").hidden = false;
    $("bizname").textContent = S.biz.name;
    setBadge("today", S.jobs.filter(j => j.status === "pending").length + S.alerts.length);
    setBadge("messages", convos().filter(c => c.needsReply).length);
    document.querySelectorAll("[data-tab]").forEach(b => b.setAttribute("aria-current", b.dataset.tab === tab ? "page" : "false"));
    const top = sample ? '<div class="sample">Sample business with made-up customers. Nothing here is saved or texted. <a href="./">Sign in</a></div>' : "";
    $("gear").hidden = false;
    const views = { today: viewToday, jobs: viewJobs, customers: viewCustomers, results: viewResults, settings: viewSettings };
    $("view").innerHTML = top + (tab === "messages" ? (chatId ? viewChat() : viewInbox()) : (views[tab] || viewToday)());
    if (tab === "messages" && chatId) { growBox(); window.scrollTo(0, document.body.scrollHeight); }
    if (tab === "results") drawChart();
  }

  function growBox() { const t = $("msg"); if (t) { t.style.height = "auto"; t.style.height = Math.min(150, t.scrollHeight + 2) + "px"; } }

  let toastTimer;
  function toast(text) {
    const t = $("toast"); t.textContent = text; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
  }

  function go(next, cid) {
    tab = next; chatId = cid || null;
    if (next !== "settings") draft = null;
    closeSheet(); render(); window.scrollTo(0, cid ? document.body.scrollHeight : 0);
  }

  // ---------- Taps ----------
  document.addEventListener("click", e => {
    const t = e.target.closest("[data-tab],[data-act],[data-chat],[data-job],[data-svc],[data-close],[data-back],[data-seg],[data-cancel],[data-signout],[data-cust],[data-custedit],[data-newjob],[data-editjob],[data-days]");
    if (!t) return;
    const d = t.dataset;
    if (d.tab) return go(d.tab);
    if (d.chat) { composeText = ""; return go("messages", d.chat); }
    if (d.back !== undefined) return go("messages");
    if (d.seg) { jobsView = d.seg; return render(); }
    if (d.days !== undefined) { resultsDays = Number(d.days); return render(); }
    if (d.cust) return custSheet(d.cust);
    if (d.custedit) return custSheet(d.custedit, true);
    if (d.newjob !== undefined) return S.services.some(s => !s.is_addon && s.active) ? jobForm(null, d.newjob || null) : toast("Add a service in Settings first.");
    if (d.editjob) return jobForm(d.editjob);
    if (d.job) return jobSheet(d.job);
    if (d.cancel) return jobSheet(d.cancel, true);
    if (d.svc) return serviceSheet(d.svc === "new" ? null : d.svc);
    if (d.close !== undefined) return closeSheet();
    if (d.signout !== undefined) return sb.auth.signOut().then(() => location.replace("./"));
    const a = d.act;
    if (a === "approve" || a === "decline" || a === "done") return act(a, { job_id: d.id }, t);
    if (a === "cancel") return act("cancel", { job_id: d.id, notify: !!$("notify")?.checked }, t);
    if (a === "handled") return act("handled", { id: d.id }, t);
    if (a === "pause") return act("pause", { customer_id: chatId, on: d.on === "1" }, t);
    if (a === "saveSettings") return saveSettings(t);
  });

  function saveSettings(btn) {
    const b = { ...draft.biz };
    const digits = b.owner_phone.replace(/\D/g, "").replace(/^1(?=\d{10}$)/, "");
    if (b.owner_phone && digits.length !== 10) return toast("Your cell needs to be a 10-digit number.");
    if (!b.name.trim()) return toast("Your business needs a name.");
    for (const h of draft.hours) if (h.open && h.close_time <= h.open_time) return toast("Closing time has to be after opening time.");
    b.owner_phone = digits ? "+1" + digits : null;
    b.name = b.name.trim();
    b.review_link = b.review_link.trim() || null;
    b.service_area = b.service_area.trim() || null;
    b.ai_notes = b.ai_notes.trim() || null;
    b.rebook_days = b.rebook_days > 0 ? b.rebook_days : null;
    const hours = draft.hours.filter(h => h.open).map(h => ({ weekday: h.weekday, open_time: h.open_time, close_time: h.close_time }));
    draft = null;
    act("saveSettings", { biz: b, hours }, btn);
  }

  document.addEventListener("input", e => {
    const t = e.target;
    if (t.id === "msg") { composeText = t.value; return growBox(); }
    if (t.id === "custq") { custQuery = t.value; $("custlist").innerHTML = custRows(); return; }
    const jf = t.closest("#jobform");
    if (jf) {
      if (t.name === "price" || t.name === "hours") jf.dataset.touched = "1";
      if (t.name === "cust") {
        $("newcust").hidden = !!t.value;
        const len = S.customers[t.value]?.length_ft;
        jf.len.value = len ?? "";
      }
      if (["svc", "add", "len", "cust"].includes(t.name)) fillJobForm(jf);
      return;
    }
    if (!draft) return;
    if (t.dataset.k) {
      const k = t.dataset.k;
      if (k === "approve_all") draft.biz.auto_confirm = !t.checked;
      else if (k === "rebook_weeks") draft.biz.rebook_days = Math.max(0, Math.round(Number(t.value) || 0)) * 7;
      else if (t.type === "checkbox") draft.biz[k] = t.checked;
      else if (t.type === "number") draft.biz[k] = Number(t.value) || 0;
      else draft.biz[k] = t.value;
      if (k === "discount_policy") render();
    }
    if (t.dataset.h) {
      const h = draft.hours[Number(t.dataset.h)];
      if (t.dataset.hk === "open") { h.open = t.checked; render(); }
      else h[t.dataset.hk] = t.value;
    }
  });

  document.addEventListener("submit", e => {
    e.preventDefault();
    const form = e.target;
    if (form.id === "compose") {
      const body = composeText.trim();
      if (!body) return;
      const btn = form.querySelector("button");
      composeText = "";
      return act("send", { customer_id: chatId, body }, btn);
    }
    if (form.id === "svcform") {
      const v = new FormData(form);
      return act("saveService", {
        ...(form.dataset.id ? { id: form.dataset.id } : {}),
        name: String(v.get("name")).trim(), price: Number(v.get("price")) || 0, price_per_foot: Number(v.get("ppf")) > 0 ? Number(v.get("ppf")) : null,
        duration_minutes: Math.max(30, Math.round(Number(v.get("hours")) * 2) * 30),
        includes: String(v.get("includes")).trim() || null, is_addon: v.has("is_addon"), active: v.has("active"),
      }, form.querySelector("button"));
    }
    if (form.id === "jobform") return saveJobForm(form);
    if (form.id === "custform") {
      const v = new FormData(form), len = Number(v.get("length_ft"));
      const val = k => String(v.get(k) || "").trim() || null;
      return act("saveCustomer", { id: form.dataset.id, fields: { name: val("name"), vehicle: val("vehicle"), address: val("address"), notes: val("notes"), length_ft: len > 0 ? len : null } },
        form.querySelector("button"));
    }
    if (form.id === "login") return sendCode(form);
    if (form.id === "code") return checkCode(form);
  });

  // Enter sends on a computer; Shift+Enter makes a new line
  document.addEventListener("keydown", e => {
    if (e.target.id === "msg" && e.key === "Enter" && !e.shiftKey && matchMedia("(hover:hover)").matches) {
      e.preventDefault(); $("compose").requestSubmit();
    }
  });

  // ---------- Sign in with a code sent by email ----------
  let loginEmail = "";
  function showLogin(step, note) {
    document.body.classList.add("out");
    $("tabs").hidden = true;
    $("gear").hidden = true;
    $("bizname").textContent = "";
    $("view").innerHTML = '<div class="login"><div class="card">' + (step === "code"
      ? '<h1 class="page">Check your email</h1><p class="sub">We sent a sign-in link and code to <b>' + esc(loginEmail) + "</b>. Tap the link, or type the code here.</p>" +
        '<form id="code"><label class="f">Code<input class="in" name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" required></label>' +
        '<div class="btns"><button class="b main wide" type="submit">Sign in</button></div></form>' +
        '<div class="btns"><button type="button" class="b link" id="restart">Use a different email</button></div>'
      : '<h1 class="page">Sign in</h1><p class="sub">Use the email you gave ItGo. We\'ll email you a sign-in code. No password needed.</p>' +
        '<form id="login"><label class="f">Email<input class="in" name="email" type="email" autocomplete="email" required value="' + esc(loginEmail) + '"></label>' +
        '<div class="btns"><button class="b main wide" type="submit">Email me a code</button></div></form>') +
      (note ? '<p class="note">' + esc(note) + "</p>" : "") +
      '</div><p class="sub" style="text-align:center;margin-top:16px"><a href="?sample=1">See a sample business</a></p></div>';
    const r = $("restart"); if (r) r.onclick = () => showLogin("email");
  }

  async function sendCode(form) {
    loginEmail = String(new FormData(form).get("email")).trim().toLowerCase();
    form.querySelector("button").disabled = true;
    const { error } = await sb.auth.signInWithOtp({ email: loginEmail, options: { emailRedirectTo: location.origin + location.pathname } });
    if (error) return showLogin("email", error.message.includes("rate") ? "Too many tries. Wait a minute and try again." : error.message);
    showLogin("code");
  }

  async function checkCode(form) {
    form.querySelector("button").disabled = true;
    const token = String(new FormData(form).get("code")).trim();
    const { error } = await sb.auth.verifyOtp({ email: loginEmail, token, type: "email" });
    if (error) return showLogin("code", "That code didn't work. Check the newest email and try again.");
    start();
  }

  async function start() {
    try {
      if (!(await load())) {
        const { data: { user } } = await sb.auth.getUser();
        document.body.classList.add("out");
        $("view").innerHTML = '<div class="login"><div class="card"><h1 class="page">Almost there</h1><p class="sub">You\'re signed in as <b>' + esc(user?.email) +
          "</b>, but no business is linked to that email yet. Email <a href=\"mailto:support@itgoai.net\">support@itgoai.net</a> and we'll connect it.</p>" +
          '<div class="btns"><button type="button" class="b link" data-signout>Sign out</button></div></div></div>';
        return;
      }
      render();
    } catch (e) {
      $("view").innerHTML = '<p class="msg">Couldn\'t load your business right now. Pull down to refresh, or try again in a minute.</p>';
      console.error(e);
    }
  }

  // New texts and bookings show up on their own while the app is open
  setInterval(async () => {
    if (sample || !S || busy || document.hidden || sheet.open || tab === "settings" || composeText) return;
    try { if (await load()) render(); } catch (e) { console.error(e); }
  }, 30000);

  if (sample) { S = sampleState(); render(); return; }
  sb = window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, detectSessionInUrl: true, flowType: "implicit" } });
  sb.auth.getSession().then(({ data: { session } }) => session ? start() : showLogin("email"));
})();
</script>
</body>
</html>
